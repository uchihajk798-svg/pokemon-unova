name: Publicar site Pokémon Unova (Pages)

on:
  push:
    branches: [main]
    paths:
      - "docs/index.html"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pokemon-unova-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obter arquivos
        uses: actions/checkout@v4
      - name: Configurar Pages (requer Pages habilitado em Settings)
        uses: actions/configure-pages@v5
      - name: Empacotar somente site estático, sem ROM
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4
