name: Construir patch Pokémon Unova

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Testes unitários
        run: python3 -m unittest discover -s tests -v
      - name: Conferir catálogo
        run: python3 -c 'from pathlib import Path; import json; x=json.loads(Path("data/unova_species.json").read_text())["species"]; assert [s["national_id"] for s in x] == list(range(494, 650))'

  smoke-base:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Baixar apenas o código da base, sem ROMs
        run: git clone --depth=1 https://github.com/Faceplantfloor/pokefirered-expansion.git /tmp/firered-base
      - name: Aplicar modificações de Unova
        run: python3 tools/apply_unova.py --game-dir /tmp/firered-base --report /tmp/unova-report.json
      - name: Conferir referências de espécies
        run: python3 tools/validate_unova.py --game-dir /tmp/firered-base
      - name: Mostrar relatório (sem upload de ROM)
        run: cat /tmp/unova-report.json

  compilar-gba:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Instalar dependências de compilação
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi libpng-dev
      - name: Clonar base e compilador C para GBA
        run: |
          git clone --depth=1 https://github.com/Faceplantfloor/pokefirered-expansion.git /tmp/firered-base
          git clone --depth=1 https://github.com/pret/agbcc.git /tmp/agbcc
          (cd /tmp/agbcc && ./build.sh && ./install.sh /tmp/firered-base)
      - name: Compilar referência original localmente (não publicar)
        run: |
          make -C /tmp/firered-base -j2
          cp /tmp/firered-base/pokefirered.gba /tmp/firered-original.gba
      - name: Substituir Pokémon por espécies de Unova
        run: python3 tools/apply_unova.py --game-dir /tmp/firered-base
      - name: Validar referências do projeto
        run: python3 tools/validate_unova.py --game-dir /tmp/firered-base
      - name: Compilar versão Unova sem publicar a ROM
        run: |
          make -C /tmp/firered-base -j2
          test -f /tmp/firered-base/pokefirered.gba
      - name: Criar patch diferencial BPS e validar checksum
        run: |
          python3 tools/bps.py create --base /tmp/firered-original.gba --modified /tmp/firered-base/pokefirered.gba --output dist/pokemon-unova.bps
          python3 tools/bps.py verify --base /tmp/firered-original.gba --patch dist/pokemon-unova.bps
          sha256sum /tmp/firered-original.gba | sed 's@/tmp/firered-original.gba@firered-original.gba@' > dist/base-sha256.txt
          sha256sum dist/pokemon-unova.bps > dist/patch-sha256.txt
      - name: Publicar SOMENTE patch BPS (nenhuma ROM)
        uses: actions/upload-artifact@v4
        with:
          name: pokemon-unova-bps
          path: |
            dist/pokemon-unova.bps
            dist/base-sha256.txt
            dist/patch-sha256.txt
          retention-days: 7
          if-no-files-found: error

