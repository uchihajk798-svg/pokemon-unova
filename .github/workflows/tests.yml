name: Construir patch Pokémon Unova

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-unova-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Testes unitários
        run: python3 -m unittest discover -s tests -v
      - name: Conferir catálogo
        run: python3 -c 'from pathlib import Path; import json; x=json.loads(Path("data/unova_species.json").read_text())["species"]; assert [s["national_id"] for s in x] == list(range(494, 650))'

  smoke-base:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Baixar apenas o código da base, sem ROMs
        run: |
          git init /tmp/firered-base
          git -C /tmp/firered-base remote add origin https://github.com/Faceplantfloor/pokefirered-expansion.git
          git -C /tmp/firered-base fetch --depth=1 origin a2bb3bd82d43e636f5d78090682afdb756257bd5
          git -C /tmp/firered-base checkout --detach FETCH_HEAD
      - name: Aplicar modificações de Unova
        run: python3 tools/apply_unova.py --game-dir /tmp/firered-base --report /tmp/unova-report.json
      - name: Conferir referências de espécies
        run: python3 tools/validate_unova.py --game-dir /tmp/firered-base
      - name: Checar compatibilidade dos HMs
        run: python3 tools/validate_hms.py --game-dir /tmp/firered-base
      - name: Mostrar relatório (sem upload de ROM)
        run: cat /tmp/unova-report.json

  compilar-gba:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Instalar dependências de compilação
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi libpng-dev mgba-sdl xvfb imagemagick
      - name: Clonar base e compilador C para GBA
        run: |
          git init /tmp/firered-base
          git -C /tmp/firered-base remote add origin https://github.com/Faceplantfloor/pokefirered-expansion.git
          git -C /tmp/firered-base fetch --depth=1 origin a2bb3bd82d43e636f5d78090682afdb756257bd5
          git -C /tmp/firered-base checkout --detach FETCH_HEAD
          git clone --depth=1 https://github.com/pret/agbcc.git /tmp/agbcc
          (cd /tmp/agbcc && ./build.sh && ./install.sh /tmp/firered-base)
      - name: Compilar referência original localmente (não publicar)
        run: |
          make -C /tmp/firered-base -j2
          cp /tmp/firered-base/pokefirered.gba /tmp/firered-original.gba
      - name: Substituir Pokémon por espécies de Unova
        run: python3 tools/apply_unova.py --game-dir /tmp/firered-base
      - name: Validar referências do projeto
        run: python3 tools/validate_unova.py --game-dir /tmp/firered-base
      - name: Compilar versão Unova sem publicar a ROM
        run: |
          make -C /tmp/firered-base -j2
          test -f /tmp/firered-base/pokefirered.gba
      - name: Teste de inicialização no emulador mGBA (sem publicar ROM)
        run: |
          export SDL_AUDIODRIVER=dummy
          xvfb-run -a -s "-screen 0 640x480x24" sh -ec '
            mgba /tmp/firered-base/pokefirered.gba >/tmp/mgba-boot.log 2>&1 &
            pid=$!
            sleep 9
            if ! kill -0 "$pid" 2>/dev/null; then
              cat /tmp/mgba-boot.log
              echo "mGBA terminou antes da captura"
              exit 1
            fi
            import -window root /tmp/mgba-boot.png
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          '
          test -s /tmp/mgba-boot.png
          colors=$(identify -format %k /tmp/mgba-boot.png)
          echo "mGBA iniciado; screenshot gerada localmente, cores distintas: $colors"
          test "$colors" -ge 5
      # Captura fica apenas no runner temporário; nenhuma ROM/screenshot é publicada.
      - name: Criar patch diferencial BPS e validar checksum
        run: |
          python3 tools/bps.py create --base /tmp/firered-original.gba --modified /tmp/firered-base/pokefirered.gba --output dist/pokemon-unova.bps
          python3 tools/bps.py verify --base /tmp/firered-original.gba --patch dist/pokemon-unova.bps
          sha256sum /tmp/firered-original.gba | sed 's@/tmp/firered-original.gba@firered-original.gba@' > dist/base-sha256.txt
          sha256sum dist/pokemon-unova.bps > dist/patch-sha256.txt
      - name: Preparar ROM base retail-equivalente FireRed US 1.0 a partir de código-fonte
        run: |
          git clone --depth=1 https://github.com/pret/pokefirered.git /tmp/firered-retail
          (cd /tmp/agbcc && ./install.sh /tmp/firered-retail)
          make -C /tmp/firered-retail -j2
          echo "41cb23d8dccc8ebd7c649cd8fbb58eeace6e2fdc  /tmp/firered-retail/pokefirered.gba" | sha1sum --check --status
          echo "ROM de referência FireRed US 1.0 reproduzida byte-a-byte"
      - name: Criar patch aplicável ao FireRed US 1.0 original
        run: |
          python3 tools/bps.py create --base /tmp/firered-retail/pokefirered.gba --modified /tmp/firered-base/pokefirered.gba --output dist/pokemon-unova-firered-us-v1.bps
          python3 tools/bps.py verify --base /tmp/firered-retail/pokefirered.gba --patch dist/pokemon-unova-firered-us-v1.bps
          echo "41cb23d8dccc8ebd7c649cd8fbb58eeace6e2fdc  pokefirered.gba" > dist/retail-base-sha1.txt
          sha256sum dist/pokemon-unova-firered-us-v1.bps > dist/retail-patch-sha256.txt
      - name: Publicar SOMENTE patch BPS (nenhuma ROM)
        uses: actions/upload-artifact@v4
        with:
          name: pokemon-unova-bps
          path: |
            dist/pokemon-unova.bps
            dist/pokemon-unova-firered-us-v1.bps
            dist/retail-base-sha1.txt
            dist/retail-patch-sha256.txt
            dist/base-sha256.txt
            dist/patch-sha256.txt
          retention-days: 7
          if-no-files-found: error

