name: Verificar GBA Pocket

on:
  push:
    branches: [main]
    paths:
      - "docs/app/**"
      - "docs/index.html"
      - "tests/test_patch.mjs"
      - ".github/workflows/gba-pocket.yml"
  pull_request:
    paths:
      - "docs/app/**"
      - "docs/index.html"
      - "tests/test_patch.mjs"
      - ".github/workflows/gba-pocket.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Verificar sintaxe JavaScript
        run: |
          node --check docs/app/main.mjs
          node --check docs/app/patch.mjs
          node --check docs/app/sw.js
      - name: Testar aplicação de BPS e manifesto do PWA
        run: node --test tests/test_patch.mjs
