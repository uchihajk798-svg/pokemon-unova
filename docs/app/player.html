<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>GBA Pocket — jogo</title>
<style>*{box-sizing:border-box}html,body{margin:0;background:#050c0e;color:#e8f1ea;width:100%;height:100%;overflow:hidden;font-family:system-ui,sans-serif}#game{width:100%;height:100%}#loading{position:absolute;inset:0;display:flex;justify-content:center;align-items:center;padding:25px;text-align:center;background:#071114;font-size:14px;line-height:1.5;color:#d2e9de}#loading.hidden{display:none}</style>
</head><body><div id="game"></div><div id="loading">Preparando o emulador GBA…<br>O núcleo EmulatorJS precisa de conexão à internet para carregar.</div>
<script>
"use strict";
const loading = document.getElementById("loading");
let gameUrl = null, started = false;
const say = (type, message) => {
  if (window.parent !== window) window.parent.postMessage({source:"gba-pocket-player",type,message},location.origin);
};
const error = message => {
  loading.classList.remove("hidden");
  loading.textContent=message;
  say("error",message);
};
window.addEventListener("message", e => {
  if (e.origin !== location.origin || e.source !== parent || started) return;
  const data=e.data;
  if (!data || data.source!=="gba-pocket-host" || data.type!=="load") return;
  if (!(data.buffer instanceof ArrayBuffer) || data.buffer.byteLength===0) {
    error("ROM não recebida pelo emulador.");
    return;
  }
  started = true;
  const bytes = new Uint8Array(data.buffer);
  gameUrl=URL.createObjectURL(new Blob([bytes],{type:"application/octet-stream"}));
  window.EJS_player="#game";
  window.EJS_core="gba";
  window.EJS_gameUrl=gameUrl;
  window.EJS_gameName=data.name || "gba-pocket";
  window.EJS_pathtodata="https://cdn.emulatorjs.org/stable/data/";
  window.EJS_color="#b6f071";
  window.EJS_language="pt-BR";
  window.EJS_startOnLoaded=true;
  window.EJS_onGameStart=()=>{loading.classList.add("hidden");say("started");};
  window.EJS_onSaveUpdate=()=>say("save");
  const script=document.createElement("script");
  script.src="https://cdn.emulatorjs.org/stable/data/loader.js";
  script.onerror=()=>error("Não foi possível carregar o EmulatorJS. Verifique sua conexão e tente novamente.");
  document.body.append(script);
});
window.addEventListener("beforeunload",()=>{if(gameUrl)URL.revokeObjectURL(gameUrl);});
say("ready");
</script>
</body></html>
